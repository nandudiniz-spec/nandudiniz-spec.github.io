<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b2f4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anqui">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Anqui</title>
  <link rel="manifest" href="/manifest.webmanifest?v=4">
  <link rel="icon" type="image/png" href="/icon-180.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=4">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-180.png?v=4">
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f7f9fc;
      color:#17334a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f9fc}
    body{position:fixed;inset:0}
    #app-shell{
      position:fixed;
      top:env(safe-area-inset-top,0px);
      right:0;
      bottom:env(safe-area-inset-bottom,0px);
      left:0;
      overflow:hidden;
      background:#f7f9fc;
    }
    #anqui-app{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#f7f9fc;
    }
    #loading{
      position:absolute;
      inset:0;
      z-index:2;
      display:grid;
      place-items:center;
      background:#f7f9fc;
      transition:opacity .18s ease,visibility .18s ease;
    }
    #loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loading-card{text-align:center;padding:28px}
    .loading-card img{
      width:88px;
      height:88px;
      border-radius:20px;
      box-shadow:0 10px 28px rgba(11,47,75,.16);
    }
    .loading-card p{margin:16px 0 0;font-size:17px;color:#496273}
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="loading" aria-live="polite">
      <div class="loading-card">
        <img src="/icon-180.png?v=4" alt="Anqui">
        <p>Abrindo Anqui…</p>
      </div>
    </div>
    <iframe
      id="anqui-app"
      title="Anqui"
      src="https://script.google.com/macros/s/AKfycbx_JUFxY9sRDY-BOcDpDsmb5DMDrifWXJeswavJRTbKYeLUEN6dbQYYY6aBYTS-a0rH-w/exec?embedded=1"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>
  <script>
    (() => {
      const frame = document.getElementById('anqui-app');
      const loading = document.getElementById('loading');
      frame.addEventListener('load', () => {
        window.setTimeout(() => loading.classList.add('hidden'), 120);
      }, { once: true });
    })();
  </script>
</body>
</html>
