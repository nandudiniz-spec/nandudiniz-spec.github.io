<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b2f4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anqui">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Anqui</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f9fc}
    body{position:fixed;inset:0;padding:0;overscroll-behavior:none}
    #app{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading{position:absolute;inset:0;display:grid;place-items:center;font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17334a;background:#f7f9fc;z-index:2}
    #loading.hidden{display:none}
  </style>
</head>
<body>
  <div id="loading">Abrindo Anqui…</div>
  <iframe id="app"
    title="Anqui"
    src="https://script.google.com/macros/s/AKfycbx_JUFxY9sRDY-BOcDpDsmb5DMDrifWXJeswavJRTbKYeLUEN6dbQYYY6aBYTS-a0rH-w/exec"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const frame=document.getElementById('app');
    const loading=document.getElementById('loading');
    frame.addEventListener('load',()=>loading.classList.add('hidden'),{once:true});
    setTimeout(()=>loading.classList.add('hidden'),12000);
  </script>
</body>
</html>
