<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b2f4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anqui">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Anqui</title>
  <link rel="manifest" href="/manifest.webmanifest?v=2">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=2">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-180.png?v=2">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17334a;background:#f7f9fc}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f7f9fc}
    body{min-height:100svh;display:none;place-items:center;padding:24px}
    main{width:min(420px,100%);text-align:center}
    img{width:112px;height:112px;border-radius:24px;box-shadow:0 12px 32px rgba(11,47,75,.18)}
    h1{margin:20px 0 10px;font-size:30px}
    p{margin:0;line-height:1.45;color:#496273}
  </style>
  <script>
    (() => {
      const APP_URL='https://script.google.com/macros/s/AKfycbx_JUFxY9sRDY-BOcDpDsmb5DMDrifWXJeswavJRTbKYeLUEN6dbQYYY6aBYTS-a0rH-w/exec';
      const params=new URLSearchParams(window.location.search);
      const install=params.get('install')==='1';
      const standalone=window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches;

      if (!install || standalone) {
        window.location.replace(APP_URL);
        return;
      }

      window.addEventListener('DOMContentLoaded',()=>{
        document.body.style.display='grid';
      });
    })();
  </script>
</head>
<body>
  <main>
    <img src="/icon-180.png?v=2" alt="Anqui">
    <h1>Anqui</h1>
    <p>Use Compartilhar → Adicionar à Tela de Início.</p>
  </main>
</body>
</html>
