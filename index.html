<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b2f4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anqui">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Anqui</title>
  <link rel="manifest" href="/manifest.webmanifest?v=3">
  <link rel="icon" type="image/png" href="/icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-180.png?v=3">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17334a;background:#f7f9fc}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f7f9fc}
    body{min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
    main{width:min(420px,100%);text-align:center}
    img{width:112px;height:112px;border-radius:24px;box-shadow:0 12px 32px rgba(11,47,75,.18)}
    h1{margin:20px 0 8px;font-size:30px}
    p{margin:0 0 18px;line-height:1.45;color:#496273}
    .hint{padding:14px 16px;border-radius:14px;background:#fff;border:1px solid #dce6ec;text-align:left}
    a{display:block;margin-top:16px;padding:14px 18px;border-radius:14px;background:#0b5f7c;color:white;text-decoration:none;font-weight:700}
    #launching{display:none}
  </style>
</head>
<body>
  <main>
    <img src="/icon-180.png?v=3" alt="Anqui">
    <h1>Anqui</h1>
    <div id="install">
      <p>Adicione esta página à Tela de Início para usar o ícone do Anqui.</p>
      <p class="hint"><strong>No Safari:</strong> Compartilhar → Adicionar à Tela de Início.</p>
      <a id="openNow" href="https://script.google.com/macros/s/AKfycbx_JUFxY9sRDY-BOcDpDsmb5DMDrifWXJeswavJRTbKYeLUEN6dbQYYY6aBYTS-a0rH-w/exec">Abrir Anqui agora</a>
    </div>
    <div id="launching"><p>Abrindo Anqui…</p></div>
  </main>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbx_JUFxY9sRDY-BOcDpDsmb5DMDrifWXJeswavJRTbKYeLUEN6dbQYYY6aBYTS-a0rH-w/exec';
    const standalone=window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches;
    if(standalone){
      document.getElementById('install').style.display='none';
      document.getElementById('launching').style.display='block';
      setTimeout(()=>window.location.replace(APP_URL),80);
    }
  </script>
</body>
</html>
